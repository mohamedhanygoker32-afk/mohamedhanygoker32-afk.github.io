<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="monetag" content="25da4530d2041748b9509b3201e449a8">
    <title>Task Verification</title>
    <style>
        body { text-align: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 0; }
        .header-box { background-color: #fff; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 100; }
        h2 { color: #333; margin-top: 0;}
        #timer { font-size: 28px; font-weight: bold; color: #d9534f; padding: 10px; background-color: #ffeaea; border-radius: 8px; display: inline-block; }
        .content-area { min-height: 150vh; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; justify-content: space-around; }
        #claimBtn { display: none; padding: 18px 40px; font-size: 22px; font-weight: bold; background-color: #28a745; color: white; border: none; border-radius: 10px; cursor: pointer; margin: 40px auto; text-decoration: none; box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4); }
        .instructions { color: #555; font-size: 16px; margin-bottom: 20px;}
    </style>
</head>
<body>
    <div class="header-box">
        <h2 id="titleText">Complete the task to get points</h2>
        <div id="timer">Remaining: 40 seconds</div>
    </div>
    <div class="content-area">
        <p class="instructions" id="inst1">Please stay on this page and scroll down until the claim button appears.</p>
        
        <!-- كود الإعلان -->
        <script>(function(s){s.dataset.zone='11903878',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>

        <p class="instructions" id="inst2">The button will appear at the bottom of the page after the timer ends.</p>
        
        <a id="claimBtn" href="#">🎁 Claim Points & Return 🎁</a>
    </div>

    <script>
        // سحب التوكن من الرابط لتأمين زر الاستلام
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const claimBtn = document.getElementById('claimBtn');
        
        if (token) {
            claimBtn.href = `https://t.me/Hellspotbot?start=claim_${token}`;
        } else {
            claimBtn.href = `https://t.me/Hellspotbot`; // إذا حاول الدخول بدون توكن
        }

        const translations = {
            ar: { title: "أكمل المهمة لاستلام النقاط", remain: "يتبقى: ", sec: " ثانية", stop: "العداد متوقف!", done: "✅ اكتمل الوقت! انزل للأسفل", inst1: "يرجى البقاء في هذه الصفحة والتمرير للأسفل.", inst2: "الزر سيظهر في أسفل الصفحة.", claim: "🎁 استلام النقاط 🎁", dir: "rtl" },
            ru: { title: "Завершите задание", remain: "Осталось: ", sec: " секунд", stop: "Таймер остановлен!", done: "✅ Время вышло! Прокрутите вниз", inst1: "Оставайтесь на странице и прокрутите вниз.", inst2: "Кнопка появится внизу.", claim: "🎁 Получить очки 🎁", dir: "ltr" },
            en: { title: "Complete the task", remain: "Remaining: ", sec: " seconds", stop: "Timer stopped!", done: "✅ Time's up! Scroll down", inst1: "Stay on this page and scroll down.", inst2: "The button will appear at the bottom.", claim: "🎁 Claim Points 🎁", dir: "ltr" }
        };

        const userLang = navigator.language || navigator.userLanguage;
        let lang = 'en';
        if (userLang.startsWith('ar')) lang = 'ar';
        else if (userLang.startsWith('ru')) lang = 'ru';
        const t = translations[lang];

        document.documentElement.lang = lang;
        document.documentElement.dir = t.dir;
        document.getElementById('titleText').innerText = t.title;
        document.getElementById('inst1').innerText = t.inst1;
        document.getElementById('inst2').innerText = t.inst2;
        claimBtn.innerText = t.claim;

        let timeLeft = 40;
        const timerElement = document.getElementById('timer');
        let isTabActive = true;
        timerElement.innerText = t.remain + timeLeft + t.sec;

        document.addEventListener("visibilitychange", function() {
            if (document.hidden) {
                isTabActive = false;
                timerElement.innerText = t.stop;
                timerElement.style.backgroundColor = "#fff3cd";
            } else {
                isTabActive = true;
                timerElement.style.backgroundColor = "#ffeaea";
                timerElement.innerText = t.remain + timeLeft + t.sec;
            }
        });

        const countdown = setInterval(() => {
            if (isTabActive && timeLeft > 0) {
                timeLeft--;
                timerElement.innerText = t.remain + timeLeft + t.sec;
            }
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerElement.innerText = t.done;
                timerElement.style.backgroundColor = "#d4edda";
                claimBtn.style.display = 'block'; 
            }
        }, 1000);
    </script>
</body>
</html>
